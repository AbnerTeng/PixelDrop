name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-flow.sh
      - run: ARCHS='arm64 x86_64' ./scripts/build.sh
      - run: tar -czf PixelDrop-macos-universal.tar.gz -C dist PixelDrop.app
      - run: ./scripts/build-dmg.sh
      - run: cp dist/release/PixelDrop-macos-universal.dmg .
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            PixelDrop-macos-universal.tar.gz
            PixelDrop-macos-universal.dmg
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 xvfb
      - run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
      - run: tar -czf PixelDrop-ubuntu.tar.gz -C linux pixeldrop.py -C "$PWD/assets" PixelDrop.png
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: PixelDrop-ubuntu.tar.gz
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: |
          sha256sum PixelDrop-*.tar.gz PixelDrop-*.dmg > SHA256SUMS
          python3 scripts/homebrew-formula.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" PixelDrop-macos-universal.tar.gz pixeldrop.rb
          python3 scripts/homebrew-formula.py --cask "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" PixelDrop-macos-universal.dmg pixeldrop-cask.rb
      - run: gh release create "$GITHUB_REF_NAME" PixelDrop-*.tar.gz PixelDrop-*.dmg SHA256SUMS pixeldrop.rb pixeldrop-cask.rb install.sh --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
